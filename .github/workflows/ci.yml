# 두 목차 생성기(build-index.ps1 / build-index.py)의 약속을 검증한다:
#   1. 동일 출력 — 같은 입력이면 바이트 동일한 _INDEX.md·OVERVIEW.md
#   2. 멱등성 — 생성 직후 -Check/--check가 "변경 불필요"(exit 0)
name: ci

on:
  push:
  pull_request:

jobs:
  generator-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build twin fixtures
        run: |
          mkdir -p /tmp/fix1/apps/proj-a /tmp/fix1/apps/proj-b
          printf -- '---\nstatus: 개발\nupdated: 2026-01-01\nsummary: fixture A\nrepo: example/a\n---\n# a\n' > /tmp/fix1/apps/proj-a/HANDOFF.md
          printf -- '---\nstatus: 운영\nupdated: 2026-01-02\nsummary: fixture B\n---\n# b\n' > /tmp/fix1/apps/proj-b/HANDOFF.md
          mkdir -p /tmp/fix1/apps/proj-c
          printf -- '---\nstatus: building\nupdated: 2026-01-03\nsummary: fixture C (alias)\n---\n# c\n' > /tmp/fix1/apps/proj-c/HANDOFF.md
          mkdir -p /tmp/fix1/docs/guides
          printf -- '# shared guide\n' > /tmp/fix1/docs/guides/x.md
          cp -r /tmp/fix1 /tmp/fix2

      - name: Run PowerShell generator
        run: pwsh -File ./build-index.ps1 -Root /tmp/fix1

      - name: Run Python generator
        run: python3 build-index.py --root /tmp/fix2

      - name: Compare outputs (byte-identical)
        run: |
          cmp /tmp/fix1/apps/_INDEX.md /tmp/fix2/apps/_INDEX.md
          diff <(sed 's|fix1|fixN|g' /tmp/fix1/OVERVIEW.md) <(sed 's|fix2|fixN|g' /tmp/fix2/OVERVIEW.md)

      - name: alias normalized to canonical
        run: grep -q '개발' /tmp/fix1/apps/_INDEX.md && grep -q 'proj-c' /tmp/fix1/apps/_INDEX.md

      - name: root docs is excluded from scan
        run: |
          test ! -f /tmp/fix1/docs/_INDEX.md
          test ! -f /tmp/fix2/docs/_INDEX.md
          ! grep -q '## docs' /tmp/fix1/OVERVIEW.md

      - name: Idempotence (check mode clean right after generation)
        run: |
          pwsh -File ./build-index.ps1 -Root /tmp/fix1 -Check
          python3 build-index.py --root /tmp/fix2 --check

  enforcement-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: settings.json valid & wires both hooks
        run: python3 -c "import json; s=json.load(open('.claude/settings.json')); assert 'SessionStart' in s['hooks'] and 'Stop' in s['hooks']"

      - name: skill & command frontmatter present
        run: |
          head -1 .claude/skills/dear-agent/SKILL.md | grep -qx -- '---'
          grep -q '^name: dear-agent$' .claude/skills/dear-agent/SKILL.md
          grep -q '^description: ' .claude/skills/dear-agent/SKILL.md
          grep -q '^description: ' .claude/commands/handoff.md

      - name: hooks behave on fixture
        run: |
          mkdir -p /tmp/hfix/apps/p1
          printf -- '---\nstatus: 개발\nupdated: 2026-01-01\nsummary: fixture\n---\n' > /tmp/hfix/apps/p1/HANDOFF.md
          git init -q /tmp/hfix/apps/p1          # 프로젝트를 독립 repo로 → project 스코프 판정 조건
          cp -r .claude /tmp/hfix/
          P=/tmp/hfix/apps/p1
          SB=/tmp/hfix/.claude/hooks/session_brief.py
          HG=/tmp/hfix/.claude/hooks/handoff_guard.py
          FLAG=/tmp/hfix/.claude/tmp/dirty-apps_p1.flag   # mark_dirty 회수 플래그 (rel 'apps/p1' → 'apps_p1')
          # SessionStart 루트 스코프(cwd=워크스페이스): 전 프로젝트 표에 apps/p1
          echo '{"cwd":"/tmp/hfix","session_id":"s1"}' | python3 "$SB" | grep -q 'apps/p1'
          # SessionStart 프로젝트 스코프(cwd=프로젝트): 그 프로젝트 헤더만
          echo "{\"cwd\":\"$P\",\"session_id\":\"s2\"}" | python3 "$SB" | grep -q '현재 프로젝트: apps/p1'
          # Stop 훅은 회수 방식이다: 어떤 경우도 stdout 무출력, 스테일이면 dirty 플래그만 남기고
          # 회수는 다음 SessionStart가 한다 (옛 '매 응답 block'은 폐기).
          # Stop (a) 신선 → 무출력 + 회수 플래그 없음
          touch "$P/HANDOFF.md"
          echo "{\"cwd\":\"$P\",\"session_id\":\"guard\"}" | python3 "$HG" > /tmp/out_a
          test ! -s /tmp/out_a
          test ! -f "$FLAG"
          # Stop (b) 스테일(코드 변경 후 HANDOFF 미갱신) → 무출력이되 회수 플래그 생성
          sleep 3
          echo x > "$P/main.py"
          echo "{\"cwd\":\"$P\",\"session_id\":\"guard\"}" | python3 "$HG" > /tmp/out_b
          test ! -s /tmp/out_b
          test -f "$FLAG"
          # 회수: 다음 SessionStart(프로젝트 스코프, 새 세션)가 플래그를 감지해 '회수 필요' 주입
          echo "{\"cwd\":\"$P\",\"session_id\":\"recover\"}" | python3 "$SB" | grep -q '회수 필요'
          # Stop (c) stop_hook_active → 무출력
          echo "{\"cwd\":\"$P\",\"session_id\":\"guard\",\"stop_hook_active\":true}" | python3 "$HG" > /tmp/out_c
          test ! -s /tmp/out_c
          # Stop (d) 루트 스코프는 하위 프로젝트를 훑지 않음 → 무출력
          echo '{"cwd":"/tmp/hfix","session_id":"guard2"}' | python3 "$HG" > /tmp/out_d
          test ! -s /tmp/out_d
          # 회수 해제: HANDOFF 갱신 후 정상 종료 → 플래그 제거, 다음 SessionStart는 회수 안 함
          sleep 1
          touch "$P/HANDOFF.md"
          echo "{\"cwd\":\"$P\",\"session_id\":\"guard3\"}" | python3 "$HG" > /tmp/out_e
          test ! -f "$FLAG"
          echo "{\"cwd\":\"$P\",\"session_id\":\"recheck\"}" | python3 "$SB" > /tmp/out_f
          if grep -q '회수 필요' /tmp/out_f; then echo "회수 플래그가 clean stop 후에도 남음"; exit 1; fi
