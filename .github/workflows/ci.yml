# 두 목차 생성기(build-index.ps1 / build-index.py)의 약속을 검증한다:
#   1. 동일 출력 — 같은 입력이면 바이트 동일한 _INDEX.md·OVERVIEW.md
#   2. 멱등성 — 생성 직후 -Check/--check가 "변경 불필요"(exit 0)
name: ci

on:
  push:
  pull_request:

jobs:
  generator-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build twin fixtures
        run: |
          mkdir -p /tmp/fix1/apps/proj-a /tmp/fix1/apps/proj-b
          printf -- '---\nstatus: 개발\nupdated: 2026-01-01\nsummary: fixture A\nrepo: example/a\n---\n# a\n' > /tmp/fix1/apps/proj-a/HANDOFF.md
          printf -- '---\nstatus: 운영\nupdated: 2026-01-02\nsummary: fixture B\n---\n# b\n' > /tmp/fix1/apps/proj-b/HANDOFF.md
          cp -r /tmp/fix1 /tmp/fix2

      - name: Run PowerShell generator
        run: pwsh -File ./build-index.ps1 -Root /tmp/fix1

      - name: Run Python generator
        run: python3 build-index.py --root /tmp/fix2

      - name: Compare outputs (byte-identical)
        run: |
          cmp /tmp/fix1/apps/_INDEX.md /tmp/fix2/apps/_INDEX.md
          diff <(sed 's|fix1|fixN|g' /tmp/fix1/OVERVIEW.md) <(sed 's|fix2|fixN|g' /tmp/fix2/OVERVIEW.md)

      - name: Idempotence (check mode clean right after generation)
        run: |
          pwsh -File ./build-index.ps1 -Root /tmp/fix1 -Check
          python3 build-index.py --root /tmp/fix2 --check

  enforcement-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: settings.json valid & wires both hooks
        run: python3 -c "import json; s=json.load(open('.claude/settings.json')); assert 'SessionStart' in s['hooks'] and 'Stop' in s['hooks']"

      - name: skill & command frontmatter present
        run: |
          head -1 .claude/skills/dear-agent/SKILL.md | grep -qx -- '---'
          grep -q '^name: dear-agent$' .claude/skills/dear-agent/SKILL.md
          grep -q '^description: ' .claude/skills/dear-agent/SKILL.md
          grep -q '^description: ' .claude/commands/handoff.md

      - name: hooks behave on fixture
        run: |
          mkdir -p /tmp/hfix/apps/p1
          printf -- '---\nstatus: 개발\nupdated: 2026-01-01\nsummary: fixture\n---\n' > /tmp/hfix/apps/p1/HANDOFF.md
          cp -r .claude /tmp/hfix/
          # SessionStart: 현황 포함
          python3 /tmp/hfix/.claude/hooks/session_brief.py | grep -q 'apps/p1'
          # Stop (a) 신선 → 무출력
          touch /tmp/hfix/apps/p1/HANDOFF.md
          echo '{}' | python3 /tmp/hfix/.claude/hooks/handoff_guard.py > /tmp/out_a
          test ! -s /tmp/out_a
          # Stop (b) 스테일 → block JSON
          sleep 3
          echo x > /tmp/hfix/apps/p1/main.py
          echo '{}' | python3 /tmp/hfix/.claude/hooks/handoff_guard.py | grep -q '"decision": "block"'
          # Stop (c) stop_hook_active → 무출력
          echo '{"stop_hook_active": true}' | python3 /tmp/hfix/.claude/hooks/handoff_guard.py > /tmp/out_c
          test ! -s /tmp/out_c
